name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  check-code:
    name: Build & Test
   
    runs-on: ubuntu-latest

   
    steps:
      
      - name: Checkout Code
        uses: actions/checkout@v4

      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      
      - name: Install Dependencies
        run: bun install

      
      - name: Run Linter
        run: bun run lint

      
      - name: Build Next.js
        run: bun run build